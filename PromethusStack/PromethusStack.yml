version: '3.1'

# Prometheus Monitoring Stack
# Besteht aus: Prometheus (Metriken), Node Exporter (Host-Metriken),
#              Alertmanager (Benachrichtigungen) und Grafana (Dashboards).

services:

  # Prometheus – zentraler Metriken-Speicher und Auswertungs-Engine
  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus/:/prometheus/etc          # Konfigurationsdateien (prometheus.yml, rules)
      - prometheus_data:/prometheus/data        # Persistente TSDB-Daten
    command:
      - '--config.file=/prometheus/etc/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/prometheus/console_libraries'
      - '--web.console.templates=/prometheus/consoles'
    ports:
      - 9090:9090
    restart: unless-stopped

  # Node Exporter – exportiert Host-Metriken (CPU, RAM, Disk, Netzwerk)
  node-exporter:
    image: prom/node-exporter
    volumes:
      - /proc:/host/proc:ro      # Prozess-Informationen (read-only)
      - /sys:/host/sys:ro        # Kernel-/Hardware-Informationen (read-only)
      - /:/rootfs:ro             # Root-Dateisystem für Filesystem-Metriken (read-only)
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - --collector.filesystem.ignored-mount-points
      - "^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2|rootfs/run/docker/netns|rootfs/var/lib/docker/aufs)($$|/)"
    ports:
      - 9100:9100
    restart: unless-stopped

  # Alertmanager – verarbeitet Alerts von Prometheus und versendet Benachrichtigungen
  alertmanager:
    image: prom/alertmanager
    ports:
      - 9093:9093
    volumes:
      - "./alertmanager/:/alertmanager/etc"    # Konfigurationsdatei (config.yml)
    restart: unless-stopped
    command:
      - '--config.file=/alertmanager/etc/config.yml'
      - '--storage.path=/alertmanager'

  # Grafana – Visualisierung der Prometheus-Metriken über Dashboards
  grafana:
    image: grafana/grafana
    depends_on:
      - prometheus
    ports:
      - 3000:3000
    volumes:
      - grafana_data:/grafana                             # Persistente Dashboard- und Nutzerdaten
      - ./grafana/provisioning/:/grafana/etc/provisioning/ # Automatische Datasource-/Dashboard-Konfiguration
    env_file:
      - ./grafana/config.monitoring    # Umgebungsvariablen (Admin-Passwort, Plugins, …)
    restart: unless-stopped

volumes:
  prometheus_data:    # Persistente Zeitreihendaten von Prometheus
  grafana_data:       # Persistente Grafana-Daten (Dashboards, Nutzer, Einstellungen)
